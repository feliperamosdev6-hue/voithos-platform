services:
  - type: web
    name: voithos-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run backend:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_NG_BASE_URL
        fromService:
          type: web
          name: voithos-whatsapp-ng
          property: hostport
      - key: WHATSAPP_NG_SERVICE_TOKEN
        fromService:
          type: web
          name: voithos-whatsapp-ng
          envVarKey: SERVICE_INTERNAL_API_TOKEN
      - key: BACKEND_INTERNAL_API_TOKEN
        sync: false
      - key: PUBLIC_APP_BASE_URL
        sync: false
      - key: PUBLIC_APP_ALLOWED_ORIGINS
        sync: false
      - key: ASAAS_WEBHOOK_TOKEN
        sync: false
      - key: APPOINTMENT_ACTION_BASE_URL
        fromService:
          type: web
          name: voithos-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VOITHOS_SUPERADMIN_EMAIL
        sync: false
      - key: VOITHOS_SUPERADMIN_PASSWORD
        sync: false
      - key: VOITHOS_SUPERADMIN_CLINIC_EMAIL
        sync: false
      - key: VOITHOS_SUPERADMIN_CLINIC_NAME
        sync: false
      - key: CLINICAL_DOCUMENTS_STORAGE_ROOT
        value: /var/data/patient-documents
      - key: PLAN_MESSAGE_SCHEDULER_ENABLED
        value: "true"
      - key: APPOINTMENT_REMINDER_SCHEDULER_ENABLED
        value: "true"
      - key: SUBSCRIPTION_ENFORCEMENT_ENABLED
        value: "false"
      - key: TRUST_PROXY
        value: "true"
      - key: SECURITY_HEADERS_HSTS
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAME_SITE
        value: "none"

  - type: web
    name: voithos-whatsapp-ng
    runtime: node
    plan: starter
    rootDir: whatsapp-engine
    buildCommand: "node -e \"console.log('render-ng build step: npm ci')\" && npm ci --include=dev --no-audit --no-fund && node -e \"console.log('render-ng build step: npm run build')\" && npm run build"
    startCommand: "node -e \"console.log('render-ng start step: render-headless-runner')\" && npm run start:render"
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: WHATSAPP_QUEUE_ENABLED
        value: "false"
      - key: WHATSAPP_REDIS_WORKERS_ENABLED
        value: "false"
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: SERVICE_INTERNAL_API_TOKEN
        sync: false
      - key: CENTRAL_BACKEND_BASE_URL
        fromService:
          type: web
          name: voithos-backend
          property: hostport
      - key: CENTRAL_BACKEND_SERVICE_TOKEN
        fromService:
          type: web
          name: voithos-backend
          envVarKey: BACKEND_INTERNAL_API_TOKEN
      - key: ADMIN_PANEL_TOKEN
        sync: false
      - key: ADMIN_PANEL_READONLY_TOKEN
        sync: false
      - key: AUTH_ENCRYPTION_KEY_HEX
        sync: false
      - key: SESSIONS_DIR
        value: .sessions
      - key: WHATSAPP_ENGINE_SKIP_DOCKER
        value: "1"
