services:
  - type: web
    name: voithos-backend
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npx prisma generate
    preDeployCommand: npx prisma db push --accept-data-loss
    startCommand: npm run backend:start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: WHATSAPP_NG_BASE_URL
        fromService:
          type: web
          name: voithos-whatsapp-ng
          property: hostport
      - key: WHATSAPP_NG_SERVICE_TOKEN
        fromService:
          type: web
          name: voithos-whatsapp-ng
          envVarKey: SERVICE_INTERNAL_API_TOKEN
      - key: BACKEND_INTERNAL_API_TOKEN
        sync: false
      - key: PUBLIC_APP_BASE_URL
        fromService:
          type: web
          name: voithos-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: APPOINTMENT_ACTION_BASE_URL
        fromService:
          type: web
          name: voithos-backend
          envVarKey: RENDER_EXTERNAL_URL
      - key: VOITHOS_SUPERADMIN_EMAIL
        sync: false
      - key: VOITHOS_SUPERADMIN_PASSWORD
        sync: false
      - key: VOITHOS_SUPERADMIN_CLINIC_EMAIL
        sync: false
      - key: VOITHOS_SUPERADMIN_CLINIC_NAME
        sync: false
      - key: CLINICAL_DOCUMENTS_STORAGE_ROOT
        value: /var/data/patient-documents
      - key: PLAN_MESSAGE_SCHEDULER_ENABLED
        value: "true"
      - key: APPOINTMENT_REMINDER_SCHEDULER_ENABLED
        value: "true"

  - type: web
    name: voithos-whatsapp-ng
    runtime: node
    plan: starter
    rootDir: whatsapp-engine
    buildCommand: npm ci --include=dev && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:all:headless
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: SERVICE_INTERNAL_API_TOKEN
        sync: false
      - key: CENTRAL_BACKEND_BASE_URL
        fromService:
          type: web
          name: voithos-backend
          property: hostport
      - key: CENTRAL_BACKEND_SERVICE_TOKEN
        fromService:
          type: web
          name: voithos-backend
          envVarKey: BACKEND_INTERNAL_API_TOKEN
      - key: ADMIN_PANEL_TOKEN
        sync: false
      - key: ADMIN_PANEL_READONLY_TOKEN
        sync: false
      - key: AUTH_ENCRYPTION_KEY_HEX
        sync: false
      - key: SESSIONS_DIR
        value: .sessions
      - key: WHATSAPP_ENGINE_SKIP_DOCKER
        value: "1"

  - type: web
    name: voithos-web
    runtime: static
    rootDir: .
    buildCommand: node scripts/build-render-web.mjs
    staticPublishPath: ./render-static
    envVars:
      - key: WEB_CENTRAL_BACKEND_BASE_URL
        fromService:
          type: web
          name: voithos-backend
          envVarKey: RENDER_EXTERNAL_URL
